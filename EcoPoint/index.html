<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPoint</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Estilos personalizados -->
    <style> 
        body { /* Estilos del body */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Fondo degradado morado */
            min-height: 100vh; /* Altura mínima 100% de la ventana */
            margin: 0; /* Sin margen */
            padding: 0; /* Sin padding */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Tipografía */
        }

        .app-container { /* Contenedor principal */
            background: rgb(241, 239, 244); /* Fondo blanco */
            min-height: 100vh; /* Altura mínima 100% de la ventana */
            width: 100%; /* Ancho completo */
            display: flex; /* Flexbox */
            flex-direction: column; /* Dirección vertical */
        }

        /* Header */ /* Sección header */
        .header { /* Barra superior */
            background: linear-gradient(135deg, #96df99 0%, #85e48a 100%); /* Fondo verde degradado */
            color: white; /* Texto blanco */
            padding: 30px; /* Espacio interno */
            text-align: center; /* Texto centrado */
            font-size: 32px; /* Tamaño letra más grande */
            font-weight: bold; /* Negrita */
        }

        /* Contenido central */ /* Sección contenido */
        .content { /* Zona central */
            flex: 1; /* Ocupa espacio disponible */
            padding: 60px 30px; /* Espacio interno */
            text-align: center; /* Centrado */
            max-width: 800px; /* Ancho máximo para contenido */
            margin: 0 auto; /* Centra el contenido */
        }

        .brand-name { /* Nombre marca grande */
            font-size: 48px; /* Tamaño más grande para web */
            font-weight: bold; /* Negrita */
            color: #101210; /* Verde */
            margin-bottom: 20px; /* Margen abajo */
        }

        .welcome-text { /* Texto bienvenida */
            font-size: 24px; /* Tamaño más grande */
            color: #666; /* Gris */
            margin-bottom: 40px; /* Margen abajo */
        }

        .logo-container { /* Contenedor logo */
            margin: 40px 0; /* Margen arriba/abajo */
        }

        .logo-container img { /* Imagen logo */
            width: 150px; /* Ancho más grande para web */
            height: 240px; /* Alto proporcional */
            object-fit: cover; /* Ajuste imagen */
        }

        .subtitle { /* Subtítulo */
            font-size: 20px; /* Tamaño más grande */
            color: #646363; /* Gris claro */
            margin: 40px 0; /* Margen arriba/abajo */
            line-height: 1.6; /* Espaciado líneas */
        }

        /* Botones */ /* Sección botones */
        .btn-login { /* Botón iniciar sesión */
            background: #96df99; /* Fondo verde */
            color: rgb(17, 16, 16); /* Texto blanco */
            border: none; /* Sin borde */
            padding: 18px 40px; /* Espacio interno */
            border-radius: 15px; /* Bordes redondeados */
            font-size: 18px; /* Tamaño letra */
            font-weight: 600; /* Semi-negrita */
            margin: 10px; /* Margen alrededor */
            transition: all 0.3s; /* Transición suave */
            cursor: pointer; /* Cursor mano */
        }

        .btn-login:hover { /* Hover botón login */
            background: #4CAF50; /* Verde oscuro */
            transform: translateY(-2px); /* Eleva 2px */
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3); /* Sombra verde */
        }

        .btn-register { /* Botón registrarse */
            background: white; /* Fondo blanco */
            color: #131313; /* Texto gris */
            border: 2px solid #ddd; /* Borde gris */
            padding: 18px 40px; /* Espacio interno */
            border-radius: 15px; /* Bordes redondeados */
            font-size: 18px; /* Tamaño letra */
            font-weight: 600; /* Semi-negrita */
            margin: 10px; /* Margen alrededor */
            transition: all 0.3s; /* Transición suave */
            cursor: pointer; /* Cursor mano */
        }

        .btn-register:hover { /* Hover botón registro */
            border-color: #4CAF50; /* Borde verde */
            color: #4CAF50; /* Texto verde */
            transform: translateY(-2px); /* Eleva 2px */
        }

        /* Bottom Navigation */ /* Sección navegación inferior */
        .bottom-nav { /* Barra navegación */
            background: #f8f9fa; /* Fondo gris claro */
            padding: 20px 0; /* Espacio arriba/abajo */
            display: flex; /* Flexbox */
            justify-content: center; /* Centra iconos */
            gap: 50px; /* Espacio entre iconos */
            align-items: center; /* Centra verticalmente */
            border-top: 1px solid #e0e0e0; /* Línea superior */
        }

        .bottom-nav .material-icons { /* Iconos navegación */
            font-size: 32px; /* Tamaño más grande */
            color: #999; /* Gris */
            cursor: pointer; /* Cursor mano */
            transition: all 0.3s; /* Transición suave */
        }

        .bottom-nav .material-icons:hover { /* Hover iconos */
            color: #4CAF50; /* Verde */
            transform: scale(1.2); /* Agranda 20% */
        }

        .bottom-nav .material-icons.active { /* Icono activo */
            color: #4CAF50; /* Verde */
        }

        .bottom-nav .material-icons.profile { /* Icono perfil */
            background: #9e8fbe; /* Fondo morado */
            color: white; /* Blanco */
            padding: 10px; /* Espacio interno */
            border-radius: 50%; /* Circular */
        }

        .bottom-nav .material-icons.profile:hover { /* Hover perfil */
            background: #2bb158; /* Morado oscuro */
        }

        /* Responsive para móviles */ /* Sección responsive */
        @media (max-width: 768px) { /* Si pantalla menor 768px */
            .header { /* Ajuste header */
                font-size: 24px; /* Tamaño menor */
                padding: 20px; /* Menos padding */
            }

            .brand-name { /* Ajuste nombre marca */
                font-size: 32px; /* Tamaño menor */
            }

            .welcome-text { /* Ajuste texto bienvenida */
                font-size: 18px; /* Tamaño menor */
            }

            .logo-container img { /* Ajuste logo */
                width: 98px; /* Tamaño original móvil */
                height: 160px; /* Alto original móvil */
            }

            .subtitle { /* Ajuste subtítulo */
                font-size: 16px; /* Tamaño menor */
            }

            .bottom-nav { /* Ajuste navegación */
                gap: 30px; /* Menos espacio */
            }

            .bottom-nav .material-icons { /* Ajuste iconos */
                font-size: 28px; /* Tamaño menor */
            }
        }
    </style> <!-- Cierra estilos -->
</head>

<body>

<div class="app-container">
    
    <!-- HEADER -->
    <div class="header"> </div>

    <!-- CONTENIDO -->
    <div class="content">
        <div class="brand-name">EcoPoint</div>
        <div class="welcome-text">¡Bienvenido a EcoPoint!</div>

        <!-- LOGO -->
        <div class="logo-container">
            <img src="imagenes/logo.png" alt="Logo EcoPoint">
        </div>

        <div class="subtitle">
            Pequeños gestos,<br>grandes cambios.
        </div>

        <!-- BOTONES -->
        <button class="btn-login">Iniciar sesión</button>
        <button class="btn-register">Registrarse</button>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <span class="material-icons active">home</span>
        <span class="material-icons">search</span>
        <span class="material-icons">notifications_none</span>
        <span class="material-icons profile">person</span>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
