<!DOCTYPE html> <!-- Indica que es un documento HTML5 -->
<html lang="es"> <!-- Inicio del documento, idioma español -->
<head> <!-- Cabecera invisible -->
<meta charset="UTF-8"> <!-- Permite tildes y caracteres especiales -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta a móviles -->
<title>EcoPoint - Iniciar Sesión</title> <!-- Título en la pestaña -->

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Bootstrap desde CDN -->

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> <!-- Iconos de Google -->

<!-- Estilos personalizados -->
<style> 
    body { /* Estilos del body */
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Fondo degradado morado */
        min-height: 100vh; /* Altura mínima 100% de ventana */
        margin: 0; /* Sin margen */
        padding: 0; /* Sin padding */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Tipografía */
    }

    .app-container { /* Contenedor principal */
        background: rgb(241, 239, 244); /* Fondo  */
        min-height: 100vh; /* Altura mínima 100% */
        width: 100%; /* Ancho completo */
        display: flex; /* Flexbox */
        flex-direction: column; /* Dirección vertical */
    }

    /* Header */ 
    .header { /* Barra superior */
        background: linear-gradient(135deg, #96df99 0%, #85e48a 100%); /* Fondo verde degradado */
        color: white; /* Texto blanco */
        padding: 30px; /* Espacio interno */
        text-align: center; /* Texto centrado */
        font-size: 32px; /* Tamaño letra grande */
        font-weight: bold; /* Negrita */
    }

    /* Contenido central */
    .content { /* Zona central */
        flex: 1; /* Ocupa espacio disponible */
        padding: 60px 30px; /* Espacio interno */
        text-align: center; /* Centrado */
        max-width: 600px; /* Ancho máximo contenido */
        margin: 0 auto; /* Centra horizontalmente */
    }

    .EcoPoint { /* Texto EcoPoint */
        font-size: 40px; /* Tamaño grande */
        font-weight: bold; /* Negrita */
        color: #131413; /* Verde */
        margin-bottom: 30px; /* Margen abajo */
    }

    .title-row { /* Fila título con logo */
        display: flex; /* Flexbox */
        align-items: center; /* Centra verticalmente */
        justify-content: center; /* Centra horizontalmente */
        gap: 20px; /* Espacio entre logo y título */
        margin-bottom: 40px; /* Margen abajo */
    }

    .title-row img { /* Logo */
        width: 100px; /* Ancho */
        height: 80px; /* Alto */
        object-fit: contain; /* Ajuste imagen */
    }

    .title { /* Título "Iniciar Sesión" */
        font-size: 32px; /* Tamaño grande */
        font-weight: bold; /* Negrita */
        color: #333; /* Gris oscuro */
        margin: 0; /* Sin margen */
    }

    .form-card { /* Tarjeta del formulario */
        background: #f8f9fa; /* Fondo gris claro */
        padding: 40px; /* Espacio interno */
        border-radius: 20px; /* Bordes redondeados */
        box-shadow: 0 5px 20px rgba(0,0,0,0.1); /* Sombra suave */
    }

    .input-group { /* Grupo de input */
        margin-bottom: 25px; /* Margen abajo */
        text-align: left; /* Texto alineado izquierda */
    }

    .input-group label { /* Etiquetas */
        display: block; /* Ocupa línea completa */
        font-size: 16px; /* Tamaño */
        font-weight: 600; /* Semi-negrita */
        color: #555; /* Gris medio */
        margin-bottom: 8px; /* Separación con input */
    }

    .input-group input { /* Campos de texto */
        width: 100%; /* Ancho completo */
        padding: 15px; /* Espacio interno */
        font-size: 16px; /* Tamaño letra */
        border: 2px solid #ddd; /* Borde gris */
        border-radius: 10px; /* Bordes redondeados */
        box-sizing: border-box; /* Incluye padding en width */
        transition: all 0.3s; /* Transición suave */
    }

    .input-group input:focus { /* Input cuando está activo */
        border-color: #4CAF50; /* Borde verde */
        outline: none; /* Sin outline */
        box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1); /* Sombra verde suave */
    }

    .forgot { /* Texto olvidaste contraseña */
        text-align: right; /* Alineado derecha */
        margin: 15px 0 25px; /* Márgenes */
    }

    .forgot a { /* Enlace */
        color: #4CAF50; /* Verde */
        text-decoration: none; /* Sin subrayado */
        font-size: 14px; /* Tamaño pequeño */
    }

    .forgot a:hover { /* Hover en enlace */
        text-decoration: underline; /* Subrayado al pasar ratón */
    }

    .btn-acceder { /* Botón de acceder */
        background: #333; /* Fondo negro */
        color: white; /* Texto blanco */
        border: none; /* Sin borde */
        padding: 15px 40px; /* Espacio interno */
        border-radius: 25px; /* Bordes muy redondeados */
        font-size: 18px; /* Tamaño letra */
        font-weight: 600; /* Semi-negrita */
        width: 100%; /* Ancho completo */
        cursor: pointer; /* Cursor mano */
        transition: all 0.3s; /* Transición suave */
    }

    .btn-acceder:hover { /* Hover botón */
        background: #4CAF50; /* Fondo verde */
        transform: translateY(-2px); /* Eleva 2px */
        box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3); /* Sombra verde */
    }

    /* Bottom Navigation */
    .bottom-nav { /* Barra navegación inferior */
        background: #f8f9fa; /* Fondo gris claro */
        padding: 20px 0; /* Espacio arriba/abajo */
        display: flex; /* Flexbox */
        justify-content: center; /* Centra iconos */
        gap: 50px; /* Espacio entre iconos */
        align-items: center; /* Centra verticalmente */
        border-top: 1px solid #e0e0e0; /* Línea superior */
    }

    .bottom-nav .material-icons { /* Iconos navegación */
        font-size: 32px; /* Tamaño grande */
        color: #999; /* Gris */
        cursor: pointer; /* Cursor mano */
        transition: all 0.3s; /* Transición suave */
    }

    .bottom-nav .material-icons:hover { /* Hover iconos */
        color: #4CAF50; /* Verde */
        transform: scale(1.2); /* Agranda 20% */
    }

    .bottom-nav .material-icons.active { /* Icono activo */
        color: #4CAF50; /* Verde */
    }

    .bottom-nav .material-icons.profile { /* Icono perfil */
        background: #9e8fbe; /* Fondo morado */
        color: white; /* Blanco */
        padding: 10px; /* Espacio interno */
        border-radius: 50%; /* Circular */
    }

    .bottom-nav .material-icons.profile:hover { /* Hover perfil */
        background: #2bb158; /* Morado oscuro */
    }

    /* Responsive para móviles */
    @media (max-width: 768px) { /* Si pantalla menor 768px */
        .header { /* Ajuste header */
            font-size: 24px; /* Tamaño menor */
            padding: 20px; /* Menos padding */
        }

        .EcoPoint { /* Ajuste texto EcoPoint */
            font-size: 28px; /* Tamaño menor */
        }

        .title { /* Ajuste título */
            font-size: 24px; /* Tamaño menor */
        }

        .title-row img { /* Ajuste logo */
            width: 70px; /* Más pequeño */
            height: 55px; /* Proporcional */
        }

        .form-card { /* Ajuste formulario */
            padding: 25px; /* Menos padding */
        }

        .content { /* Ajuste contenido */
            padding: 40px 20px; /* Menos padding lateral */
        }

        .bottom-nav { /* Ajuste navegación */
            gap: 30px; /* Menos espacio */
        }

        .bottom-nav .material-icons { /* Ajuste iconos */
            font-size: 28px; /* Tamaño menor */
        }
    }
</style> <!-- Cierra estilos -->
</head> <!-- Cierra head -->

<body> <!-- Contenido visible -->

<div class="app-container"> <!-- Contenedor principal pantalla completa -->

    <!-- HEADER -->
    <div class="header"> <!-- Barra superior -->
        
    </div> <!-- Cierra header -->

    <!-- CONTENIDO -->
    <div class="content"> <!-- Zona central -->
        <p class="EcoPoint">EcoPoint</p> <!-- Texto EcoPoint en negrita -->

        <!-- TÍTULO CON LOGO -->
        <div class="title-row"> <!-- Fila que pone logo y título en horizontal -->
            <img src="imagenes/logo.png" alt="Logo"> <!-- Logo -->
            <h2 class="title">Iniciar Sesión</h2> <!-- Título grande -->
        </div> <!-- Cierra title-row -->

        <!-- FORMULARIO -->
        <div class="form-card"> <!-- Tarjeta blanca que contiene el formulario -->

            <div class="input-group"> <!-- Grupo: label + input de correo -->
                <label>Correo</label> <!-- Etiqueta encima del campo -->
                <input type="email" placeholder="email@correo.com"> <!-- Campo de texto para el email -->
            </div> <!-- Cierra input-group -->

            <div class="input-group"> <!-- Grupo: label + input de contraseña -->
                <label>Contraseña</label> <!-- Etiqueta encima del campo -->
                <input type="password" placeholder="min. 6 caracteres"> <!-- Campo oculta lo que se escribe -->
            </div> <!-- Cierra input-group -->

            <p class="forgot"><a href="#">¿Olvidaste la contraseña?</a></p> <!-- Enlace alineado a la derecha -->

            <button class="btn-acceder">Acceder</button> <!-- Botón negro para entrar -->

        </div> <!-- Cierra form-card -->

    </div> <!-- Cierra content -->

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav"> <!-- Barra inferior de navegación -->
        <span class="material-icons active">home</span> <!-- Icono casa activo, verde -->
        <span class="material-icons">search</span> <!-- Icono lupa -->
        <span class="material-icons">notifications_none</span> <!-- Icono campana -->
        <span class="material-icons profile">person</span> <!-- Icono persona con fondo morado -->
    </div> <!-- Cierra bottom-nav -->

</div> <!-- Cierra app-container -->

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script> <!-- JavaScript de Bootstrap -->

</body> <!-- Fin del contenido -->
</html> <!-- Fin del documento -->
