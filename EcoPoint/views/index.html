<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPoint</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Estilos personalizados -->
     <link rel="stylesheet" href="../assets/css/estiloK.css">
  
</head>

<body>

<div class="app-container">
    
    <!-- HEADER -->
    <div class="header"> </div>

    <!-- CONTENIDO -->
    <div class="content">
        <div class="brand-name">EcoPoint</div>
        <div class="welcome-text">¡Bienvenido a EcoPoint!</div>

        <!-- LOGO -->
        <div class="logo-container">
            <img src="../assets/images/logo.png" alt="Logo EcoPoint">
        </div>

        <div class="subtitle">
            Pequeños gestos,<br>grandes cambios.
        </div>

        <!-- BOTONES -->
        <button class="btn-login">Iniciar sesión</button>
        <button class="btn-register">Registrarse</button>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <span class="material-icons active">home</span>
        <span class="material-icons">search</span>
        <span class="material-icons">notifications_none</span>
        <span class="material-icons profile">person</span>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
